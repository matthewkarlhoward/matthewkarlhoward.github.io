<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>μOR-DMS data browser</title>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-EM3KZWJ426"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-EM3KZWJ426');
    </script>
    <script
      src="./shinylive/load-shinylive-sw.js"
      type="module"
    ></script>
    <script type="module">
      import { runExportedApp } from "./shinylive/shinylive.js";
      runExportedApp({
        id: "root",
        appEngine: "r",
        relPath: "",
      });
    </script>
    <link rel="stylesheet" href="./shinylive/style-resets.css" />
    <link rel="stylesheet" href="./shinylive/shinylive.css" />
    <style>
      #boot-message {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        padding: 24px;
        text-align: center;
        background: #ffffff;
        color: #2f4f47;
        font-family: system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
        transition: opacity 0.4s ease;
      }
      #boot-message .boot-title { font-size: 1.1rem; font-weight: 600; }
      #boot-message .boot-detail {
        font-size: 0.9rem;
        line-height: 1.5;
        max-width: 30rem;
        color: #5a6b66;
      }
      #boot-message .boot-spinner {
        width: 34px;
        height: 34px;
        border: 3px solid #d7e8e2;
        border-top-color: #4aa98e;
        border-radius: 50%;
        animation: boot-spin 0.9s linear infinite;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        #boot-message .boot-spinner { animation: none; }
      }
    </style>
    
  </head>
  <body>
    
    <div style="height: 100vh; width: 100vw" id="root"></div>

    <div id="boot-message">
      <div class="boot-spinner"></div>
      <div class="boot-title">Starting the μOR-DMS data browser</div>
      <div class="boot-detail" id="boot-detail">
        This app runs R entirely in your browser, so the first load takes
        up to a minute. Nothing is sent to a server.
      </div>
    </div>
    <script>
      (function () {
        var overlay = document.getElementById("boot-message");
        var root = document.getElementById("root");
        if (!overlay || !root) return;

        var dismissed = false;
        function dismiss() {
          if (dismissed) return;
          dismissed = true;
          clearTimeout(slowTimer);
          overlay.style.opacity = "0";
          setTimeout(function () { overlay.remove(); }, 400);
        }

        // The app mounts an iframe into #root; wait for it to finish loading.
        function watch(frame) {
          if (frame.contentDocument &&
              frame.contentDocument.readyState === "complete") dismiss();
          else frame.addEventListener("load", dismiss);
        }

        var existing = root.querySelector("iframe");
        if (existing) {
          watch(existing);
        } else {
          var observer = new MutationObserver(function () {
            var frame = root.querySelector("iframe");
            if (!frame) return;
            observer.disconnect();
            watch(frame);
          });
          observer.observe(root, { childList: true, subtree: true });
        }

        // Reassure anyone on a slow connection rather than leaving them guessing.
        var slowTimer = setTimeout(function () {
          var detail = document.getElementById("boot-detail");
          if (detail && !dismissed) {
            detail.textContent =
              "Still loading — the R runtime is a large download the first " +
              "time. It is cached afterwards, so later visits start quickly.";
          }
        }, 45000);
      })();
    </script>
    
  </body>
</html>
